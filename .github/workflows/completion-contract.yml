name: Production Completion Contract
on:
  push:
    branches:
      - main
      - production/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truthful-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject unsupported DONE claims
        run: python Scripts/production/verify_completion_contract.py
      - name: Match progression to canonical advancement master
        run: python Scripts/production/verify_advancement_progress.py
      - name: Exercise fail-closed completion regressions
        run: python -m unittest discover -s Scripts/production -p "test_completion_contract.py" -v
