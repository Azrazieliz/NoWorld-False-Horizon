name: Publish live NoWorld roadmap
on:
  push:
    branches:
      - production/gate12-full-continuation-20261023
    paths:
      - 'docs/roadmap/**'
      - '.github/workflows/publish-roadmap.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noworld-live-roadmap-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout live roadmap
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload web dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/roadmap
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
