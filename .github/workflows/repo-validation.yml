name: Repository Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python Scripts/validate_repo.py
      - name: Verify pre-Unreal completeness
        run: python Scripts/verify_pre_unreal_completeness.py
      - name: Verify exact approved Luminous 2D sources
        run: python Scripts/production/verify_gate01_luminous_art.py
